primary: "学术科研"
domain_terminology:
  - 研究假设
  - 实验设计
  - 文献综述
  - 方法论
  - 显著性检验
  - 样本量
  - 对照组
  - 同行评审
  - 影响因子
  - 基金资助
  - 开题报告
  - 学位论文
anti_leakage_patterns:
  - pattern: "(?:p|P)\\s*(?:<|>)\\s*0\\.\\d+"
    label: "统计显著性数值"
  - pattern: "(?:样本|被试|参与者|实验对象)\\s*(?:共|为|达)?\\s*\\d+\\s*(?:人|名|例|份)"
    label: "样本量数值"
  - pattern: "(?:提升|提高|改善|降低|减少)\\s*\\d+(?:\\.\\d+)?\\s*(?:%|个百分点|倍)"
    label: "实验效果量化数值"
reading_hints_base: |
  学术/科研文档重点关注：
  1. 研究问题/假设与学术背景；
  2. 研究方法、实验设计与数据来源；
  3. 核心结果与统计分析（具体数值只进入key_numbers）；
  4. 与已有工作的对比与创新点；
  5. 研究局限与未来方向。
title_slide_fields:
  - "报告标题:"
  - "报告人:"
  - "导师/课题组:"
  - "所属机构:"
  - "日期:"
document_categories:
  - 学术论文汇报
  - 学术会议演讲
  - 开题/答辩报告
  - 文献综述
  - 基金申请书
