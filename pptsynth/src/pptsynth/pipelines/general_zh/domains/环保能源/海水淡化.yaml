secondary: "海水淡化"
document_type_label: "海水淡化技术/项目材料"
reading_hints: |
  海水淡化文档通常包含：技术路线对比（反渗透/蒸馏/电渗析等）、
  系统组成与工艺流程、产水量与水质标准、能耗分析、
  项目成本与经济性、应用案例与市场前景。
  关注：不同技术路线的适用条件与核心差异（数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:产水量|淡化水量)\\s*(?:约|为|达到)?\\s*\\d+\\s*(?:吨/天|m³/天|万吨/天)"
    label: "产水量数值"
  - pattern: "(?:综合能耗|吨水能耗)\\s*(?:约|为)?\\s*\\d+(?:\\.\\d+)?\\s*(?:kWh/吨|度/吨)"
    label: "能耗数值"
