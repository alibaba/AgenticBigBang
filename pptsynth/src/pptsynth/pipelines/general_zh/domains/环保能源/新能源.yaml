secondary: "新能源"
document_type_label: "新能源项目/技术介绍"
reading_hints: |
  新能源文档通常包含：技术原理与系统构成、核心技术规格与性能参数、
  项目规模与投资估算、发电/供能效率分析、经济性测算（含数值）、
  选址与实施条件。
  关注：光伏/风电/储能等不同技术路线的适用场景区分（数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:发电效率|转换效率|光电转换率)\\s*(?:约|为|达到)\\s*\\d+(?:\\.\\d+)?%"
    label: "能源转换效率数值"
