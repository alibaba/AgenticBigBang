primary: "环保能源"
domain_terminology:
  - 碳排放
  - 碳中和
  - 可再生能源
  - 节能减排
  - 碳交易
  - 绿色能源
  - 清洁技术
  - 能耗强度
  - 光伏发电
  - 储能系统
  - 海水淡化
  - 双碳目标
anti_leakage_patterns:
  - pattern: "(?:碳排放量|CO2排放)\\s*(?:约|为|达到|减少)?\\s*\\d+\\s*(?:万吨|吨|tCO2)"
    label: "碳排放数值"
  - pattern: "(?:发电量|装机容量|装机量)\\s*(?:约|为|达到)?\\s*\\d+\\s*(?:GW|MW|kW|万千瓦|亿千瓦时)"
    label: "发电/装机量数值"
  - pattern: "(?:节能|节电|节煤|节水)\\s*(?:约|达|实现)?\\s*\\d+\\s*(?:%|万吨|吨|度|万吨标煤)"
    label: "节能减排量数值"
reading_hints_base: |
  环保能源文档重点关注：
  1. 能源/环保技术的核心原理与方案；
  2. 关键技术参数与性能指标（数值只进入key_numbers）；
  3. 与传统方案的对比优势；
  4. 应用场景与实施案例；
  5. 政策背景与市场前景。
title_slide_fields:
  - "文档标题:"
  - "汇报人/机构:"
  - "日期:"
