primary: "科技互联网"
domain_terminology:
  - 产品路线图
  - 架构设计
  - 微服务
  - API接口
  - 云原生
  - SaaS/PaaS
  - 技术栈
  - 部署方案
  - 系统集成
  - 数字化转型
  - 用户体验
  - 迭代开发
anti_leakage_patterns:
  - pattern: "\\d+\\.\\d+\\s*(?:ms|毫秒|秒|TPS|QPS|并发|线程)"
    label: "系统性能指标数值"
  - pattern: "(?:转化率|留存率|DAU|MAU|用户数|活跃用户)\\s*(?:为|达|超)\\s*\\d+"
    label: "产品运营指标数值"
  - pattern: "(?:降低|提升|优化|减少|增加)了\\s*\\d+(?:\\.\\d+)?\\s*(?:%|个百分点|倍)"
    label: "IT效益量化改善数值"
reading_hints_base: |
  科技/互联网文档重点关注：
  1. 核心产品功能或技术方案的定义与价值主张；
  2. 系统架构组件及其交互关系；
  3. 性能指标、SLA、技术规格；
  4. 与竞品或旧方案的技术对比（注意：具体数值只进入key_numbers）；
  5. 实施计划、依赖项和风险。
title_slide_fields:
  - "文档标题:"
  - "作者/团队:"
  - "所属部门/公司:"
  - "日期:"
document_categories:
  - 产品介绍
  - 技术方案
  - 架构设计
  - 信息化规划
