primary: "通信电子"
domain_terminology:
  - 频段
  - 带宽
  - 信噪比
  - 传输速率
  - 基站覆盖
  - 信号处理
  - 电路设计
  - 通信协议
  - 天线增益
  - 调制方式
  - 网络架构
  - 电磁兼容
anti_leakage_patterns:
  - pattern: "(?:频率|频段)\\s*(?:为|约|在)?\\s*\\d+(?:\\.\\d+)?\\s*(?:GHz|MHz|kHz|Hz)"
    label: "频率数值"
  - pattern: "(?:速率|吞吐量|带宽)\\s*(?:约|为|达到)?\\s*\\d+(?:\\.\\d+)?\\s*(?:Gbps|Mbps|kbps|bps)"
    label: "传输速率数值"
  - pattern: "(?:覆盖半径|覆盖范围)\\s*(?:约|为|达)\\s*\\d+\\s*(?:km|m|米|公里)"
    label: "基站覆盖范围数值"
reading_hints_base: |
  通信电子文档重点关注：
  1. 核心技术原理与参数指标；
  2. 系统架构与组件关系；
  3. 性能测试数据与标准（数值只进入key_numbers）；
  4. 技术方案的选型依据与对比；
  5. 应用场景与典型案例。
title_slide_fields:
  - "文档标题:"
  - "作者/机构:"
  - "日期:"
