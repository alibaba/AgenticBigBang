secondary: "电子电路"
document_type_label: "电子电路设计/技术材料"
reading_hints: |
  电子电路文档通常包含：电路功能与设计目标、核心元器件选型、
  电路拓扑与工作原理、关键电气参数（电压/电流/功率/频率等）、
  测试结果与性能验证。
  关注：不同电路拓扑/器件的特性对比（数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:工作电压|电源电压|额定电压)\\s*(?:为|约)?\\s*\\d+(?:\\.\\d+)?\\s*(?:V|mV|kV)"
    label: "电压参数数值"
  - pattern: "(?:效率|转换效率|功效)\\s*(?:达到|约为)?\\s*\\d+(?:\\.\\d+)?%"
    label: "电路效率数值"
