primary: "电商零售"
domain_terminology:
  - GMV
  - 转化率
  - 复购率
  - 客单价
  - ROI
  - 人货场
  - 大促活动
  - 品类运营
  - 选品策略
  - 供应链效率
  - 流量来源
  - 招商政策
anti_leakage_patterns:
  - pattern: "(?:GMV|销售额|营收)\\s*(?:约|达到|超|突破)?\\s*\\d+\\s*(?:亿|万|千万)元?"
    label: "GMV/销售额数值"
  - pattern: "(?:转化率|点击率|ROI|复购率|留存率)\\s*(?:为|约|达到)\\s*\\d+"
    label: "电商运营指标数值"
  - pattern: "(?:同比|环比|较上年|较去年)\\s*(?:增长|增加|提升|下降)\\s*\\d+(?:\\.\\d+)?%"
    label: "同环比增减数值"
reading_hints_base: |
  电商零售文档重点关注：
  1. 核心业务数据表现（GMV、转化率、客单价等）（数值只进入key_numbers）；
  2. 问题分析与原因归因；
  3. 策略方案与方法论；
  4. 竞品/品类分析洞察；
  5. 下期规划与目标。
title_slide_fields:
  - "文档标题:"
  - "汇报人/团队:"
  - "所属平台/品牌:"
  - "日期:"
