secondary: "历史事件"
document_type_label: "历史事件讲解/教学材料"
reading_hints: |
  历史事件文档通常包含：事件背景与原因、事件经过与关键节点、
  主要参与者与力量对比、事件结果与历史影响、历史评价与学术争议。
  关注：事件因果链的准确归因（避免"因A所以B"的简化）；
  具体时间节点与顺序（数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "\\d{4}\\s*年\\s*\\d+\\s*月\\s*(?:\\d+\\s*日)?\\s*(?:发生|爆发|签订|颁布)"
    label: "历史事件具体日期"
