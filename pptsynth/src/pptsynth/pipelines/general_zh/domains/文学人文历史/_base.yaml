primary: "文学人文历史"
domain_terminology:
  - 文学流派
  - 历史分期
  - 哲学思想
  - 意识形态
  - 文化背景
  - 叙事结构
  - 修辞手法
  - 历史唯物主义
  - 宗教信仰
  - 经典文本
  - 教学方法
  - 文本分析
anti_leakage_patterns:
  - pattern: "\\d{4}\\s*年\\s*(?:至|—|-–)\\s*\\d{4}\\s*年"
    label: "历史年代跨度"
  - pattern: "(?:作品|著作|诗歌|小说)\\s*(?:共|约|有)\\s*\\d+\\s*(?:篇|首|部|章)"
    label: "作品数量"
reading_hints_base: |
  文学人文历史文档重点关注：
  1. 核心概念/作品/事件的定义与背景；
  2. 关键时间节点与历史脉络（数值只进入key_numbers）；
  3. 不同学说/流派/思想的区分与对比；
  4. 典型案例或文本证据；
  5. 教学目标与学习重点（教学类文档）。
title_slide_fields:
  - "主题/标题:"
  - "讲者/教师:"
  - "机构/学校:"
  - "日期:"
