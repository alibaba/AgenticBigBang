secondary: "古典文学"
document_type_label: "古典文学赏析/研究材料"
reading_hints: |
  古典文学文档通常包含：作品概况与写作背景、作者生平与创作时期、
  主要内容与情节结构、主题思想与艺术特色、语言风格与修辞分析、
  历史影响与文学地位。
  关注：作品的时代背景与作者处境对主题的影响。
extra_anti_leakage_patterns:
  - pattern: "(?:创作于|约作于|完成于)\\s*(?:公元)?\\s*(?:前)?\\s*\\d+\\s*年"
    label: "作品创作年代"
  - pattern: "全\\s*(?:文|诗|词|曲|篇)\\s*(?:共|约)?\\s*\\d+\\s*(?:字|句|段)"
    label: "作品字数/句数"
