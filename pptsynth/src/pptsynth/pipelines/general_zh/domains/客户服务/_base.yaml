primary: "客户服务"
domain_terminology:
  - 服务规范
  - 工单
  - SLA
  - 首次解决率
  - 响应时长
  - 客户满意度
  - CSAT
  - NPS
  - 投诉处理
  - 升级机制
  - 知识库
  - FAQ
  - 客户成功
  - 服务流程
  - 话术
  - 分级分类
  - 闭环管理
  - 客户旅程
anti_leakage_patterns:
  - pattern: "(?:满意度|CSAT|首解率|首次解决率|解决率|好评率)\\s*(?:为|达|约|超)?\\s*\\d+(?:\\.\\d+)?\\s*%"
    label: "服务满意/解决率数值"
  - pattern: "(?:响应时长|处理时长|响应时间|平均处理时间|SLA)\\s*(?:约|为|达|不超过)?\\s*\\d+(?:\\.\\d+)?\\s*(?:分钟|小时|秒|min|h)"
    label: "服务时长/SLA数值"
  - pattern: "(?:工单量|投诉量|来电量|会话量)\\s*(?:约|为|达|共)?\\s*\\d+(?:\\.\\d+)?\\s*(?:单|件|次|通)"
    label: "服务量数值"
reading_hints_base: |
  客户服务文档重点关注：
  1. 服务场景、客群与服务目标；
  2. 服务流程/规范、分级分类与升级机制；
  3. 核心服务指标及短板分析（具体数值只进入key_numbers）；
  4. 典型问题/投诉的处置策略与话术；
  5. 改进措施与知识沉淀（FAQ/知识库）。
title_slide_fields:
  - "文档标题:"
  - "负责人/团队:"
  - "所属公司/部门:"
  - "日期/周期:"
document_categories:
  - 服务规范/培训
  - 投诉处理方案
  - 工单/SLA报告
  - 客户成功/FAQ
