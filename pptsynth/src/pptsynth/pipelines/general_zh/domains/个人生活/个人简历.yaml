secondary: "个人简历"
document_type_label: "个人简历/求职材料"
reading_hints: |
  个人简历文档通常包含：个人基本信息、教育背景（学历/专业/院校）、
  工作/实习经历（职责与成就）、核心技能与专长、项目经验、
  证书与荣誉、求职意向。
  关注：不同工作经历中职责与成就的区分；技能的熟练程度区分
  （精通/熟练/了解等）。
extra_anti_leakage_patterns:
  - pattern: "(?:GPA|绩点)\\s*(?:为|约|达到)?\\s*\\d+(?:\\.\\d+)?\\s*(?:/\\d+)?"
    label: "GPA绩点数值"
title_slide_fields:
  - "姓名:"
  - "求职意向:"
  - "联系方式:"
