secondary: "安全生产"
document_type_label: "安全生产培训/规程材料"
reading_hints: |
  安全生产文档通常包含：安全形势分析、重大危险源识别、
  事故案例分析与警示、安全操作规程、应急预案与处置流程、
  安全管理要求与奖惩制度。
  关注：不同危险级别的区分（一级/二级/重大风险等），
  事故类型的因果链（不含具体死亡数字）。
extra_anti_leakage_patterns:
  - pattern: "(?:事故|伤亡)\\s*(?:造成|导致)?\\s*\\d+\\s*(?:人|名)\\s*(?:死亡|受伤|失踪)"
    label: "伤亡人数"
  - pattern: "(?:直接|间接)?经济损失\\s*(?:约|共|达)?\\s*\\d+"
    label: "事故经济损失数值"
