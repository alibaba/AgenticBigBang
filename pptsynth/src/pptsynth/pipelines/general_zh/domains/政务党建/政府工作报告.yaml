secondary: "政府工作报告"
document_type_label: "政府工作报告"
reading_hints: |
  政府工作报告通常包含：过去一年/任期主要工作成效（含KPI数值）、
  重点工作专项总结、存在的困难与问题、下一年/期工作目标与任务部署。
  关注：各项KPI指标的完成情况及对比目标（具体数值只进入key_numbers）；
  重点项目进展节点。
extra_anti_leakage_patterns:
  - pattern: "(?:年增速|同比增长|增幅)\\s*(?:达到|为|约)\\s*\\d+(?:\\.\\d+)?%"
    label: "经济增速数值"
  - pattern: "(?:新增|解决|创造)\\s*(?:就业|岗位)\\s*\\d+\\s*(?:万|千)?\\s*(?:人|个)"
    label: "就业数量"
title_slide_fields:
  - "报告标题:"
  - "汇报单位:"
  - "时间:"
