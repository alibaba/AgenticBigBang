primary: "政务党建"
domain_terminology:
  - 政策落实
  - 工作部署
  - 重点任务
  - 党的建设
  - 基层治理
  - 民生工程
  - 安全生产
  - 综合治理
  - 绩效考核
  - 工作亮点
  - 问题整改
  - 对标对表
anti_leakage_patterns:
  - pattern: "(?:GDP|财政|税收|收入|支出)\\s*(?:总量|规模|增速)?\\s*(?:达到|为|超过)\\s*\\d+"
    label: "政务KPI/财政数值"
  - pattern: "完成(?:率|度)\\s*(?:达到|为|超)\\s*\\d+(?:\\.\\d+)?%"
    label: "任务完成率"
  - pattern: "(?:群众|满意度|好评率)\\s*(?:达到|为|超)\\s*\\d+(?:\\.\\d+)?%"
    label: "群众满意度数值"
reading_hints_base: |
  政务党建文档重点关注：
  1. 工作背景与指导思想；
  2. 主要工作任务与重点举措；
  3. 取得的成效与存在的问题；
  4. 下一步工作安排；
  5. 典型案例与经验做法。
title_slide_fields:
  - "文档标题:"
  - "汇报单位:"
  - "汇报人:"
  - "日期:"
document_categories:
  - 政府工作报告
  - 政策解读
  - 党课
  - 安全生产培训
