primary: "媒体新闻"
domain_terminology:
  - 选题策划
  - 采访提纲
  - 新闻要素
  - 信源
  - 事实核查
  - 交叉验证
  - 调查报道
  - 深度报道
  - 内容审核
  - 舆情监测
  - 传播声量
  - 情感分析
  - 议程设置
  - 标题党
  - 时效性
  - 客观性
  - 平衡报道
anti_leakage_patterns:
  - pattern: "(?:阅读量|播放量|转发量|点赞量|评论量|声量)\\s*(?:约|为|达|超|共)?\\s*\\d+(?:\\.\\d+)?\\s*(?:万|亿|次|条|w)"
    label: "传播数据数值"
  - pattern: "(?:正面|负面|中性|敏感)\\s*(?:情感|舆情|信息|占比)\\s*(?:为|达|约)?\\s*\\d+(?:\\.\\d+)?\\s*%"
    label: "舆情情感占比"
  - pattern: "(?:覆盖|触达)\\s*(?:用户|人群|受众)?\\s*(?:约|达|超)?\\s*\\d+(?:\\.\\d+)?\\s*(?:万|亿|人次)"
    label: "触达/覆盖数值"
reading_hints_base: |
  媒体/新闻文档重点关注：
  1. 选题/报道目标与新闻价值判断；
  2. 信源、事实核查与交叉验证要点；
  3. 关键事实、数据与引语（具体数值只进入key_numbers）；
  4. 叙事结构、平衡性与合规审核；
  5. 传播/舆情态势与结论（数值只进入key_numbers）。
title_slide_fields:
  - "文档标题:"
  - "作者/记者:"
  - "所属媒体/机构:"
  - "日期:"
document_categories:
  - 选题/采写方案
  - 事实核查报告
  - 调查/深度报道
  - 舆情监测报告
