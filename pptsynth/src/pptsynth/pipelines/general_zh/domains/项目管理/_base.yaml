primary: "项目管理"
domain_terminology:
  - 项目章程
  - 里程碑
  - 工作分解结构
  - WBS
  - 关键路径
  - 甘特图
  - 进度偏差
  - 变更管理
  - 风险登记册
  - 资源投入
  - 人天
  - 交付物
  - 验收标准
  - 干系人
  - PMO
  - 复盘
  - 挣值管理
  - 范围蔓延
anti_leakage_patterns:
  - pattern: "(?:工期|周期|工时|人天|人月)\\s*(?:约|为|达|共|合计)?\\s*\\d+(?:\\.\\d+)?\\s*(?:天|周|月|人天|人月)"
    label: "项目工期/投入数值"
  - pattern: "(?:进度|完成度|完成率|偏差)\\s*(?:为|达|约)?\\s*\\d+(?:\\.\\d+)?\\s*%"
    label: "项目进度百分比"
  - pattern: "(?:预算|成本|投入)\\s*(?:约|为|达|共)?\\s*\\d+(?:\\.\\d+)?\\s*(?:万|万元|元|亿元)"
    label: "项目预算金额"
reading_hints_base: |
  项目管理文档重点关注：
  1. 项目目标、范围与交付物定义；
  2. 计划与里程碑、关键路径与依赖关系；
  3. 进度/成本/资源的实际与偏差（具体数值只进入key_numbers）；
  4. 风险、问题与变更的识别及应对；
  5. 结论、决策事项与后续行动项。
title_slide_fields:
  - "文档标题:"
  - "项目经理/负责人:"
  - "所属团队/公司:"
  - "报告期/日期:"
document_categories:
  - 项目计划
  - 风险/变更报告
  - 项目状态汇报
  - 项目复盘报告
