secondary: "商业计划与可行性研究"
document_type_label: "商业计划/可行性研究"
reading_hints: |
  商业计划/可研文档通常包含：机会与商业模式、市场与竞争、运营与团队、
  财务预测与投资、风险与可行性结论。关注假设与可行性论证（具体数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:投资额|总投资|回收期|内部收益率|IRR|净现值|NPV)\\s*(?:约|为|达)?\\s*\\d+(?:\\.\\d+)?\\s*(?:万|亿|万元|亿元|年|%)?"
    label: "可研投资/收益数值"
