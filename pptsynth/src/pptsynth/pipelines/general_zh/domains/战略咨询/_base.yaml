primary: "战略咨询"
domain_terminology:
  - 战略规划
  - 市场规模
  - CAGR
  - 行业格局
  - 价值链
  - 竞品分析
  - SWOT
  - 波特五力
  - 商业模式
  - 增长曲线
  - 可行性研究
  - 尽职调查
  - 标杆分析
  - 细分市场
  - 护城河
  - 关键成功要素
  - 情景分析
anti_leakage_patterns:
  - pattern: "(?:市场规模|市场空间|营收规模)\\s*(?:约|为|达|预计)?\\s*\\d+(?:\\.\\d+)?\\s*(?:万|亿|万元|亿元)"
    label: "市场规模金额"
  - pattern: "(?:CAGR|年均复合增长率|增长率|市占率|渗透率)\\s*(?:为|达|约|超)?\\s*\\d+(?:\\.\\d+)?\\s*%"
    label: "增长率/份额数值"
  - pattern: "(?:提升|提高|增长|下降|降低|减少)\\s*\\d+(?:\\.\\d+)?\\s*(?:%|个百分点|倍)"
    label: "战略量化改善数值"
reading_hints_base: |
  战略/咨询文档重点关注：
  1. 战略问题/研究目标与业务背景；
  2. 市场/行业/竞争的结构化分析框架（如SWOT、五力、价值链）；
  3. 关键数据支撑的洞见与判断（具体数值只进入key_numbers）；
  4. 战略选项/方案对比与推荐；
  5. 实施路径、里程碑与风险。
title_slide_fields:
  - "文档标题:"
  - "作者/团队:"
  - "所属机构:"
  - "日期:"
document_categories:
  - 战略规划报告
  - 行业研究报告
  - 竞品分析报告
  - 商业计划/可行性研究
