primary: "财务金融"
domain_terminology:
  - 资产负债表
  - 利润表
  - 现金流量表
  - 营业收入
  - 净利润
  - 毛利率
  - 净利率
  - ROE
  - ROI
  - EBITDA
  - 预算执行
  - 成本中心
  - 内部控制
  - 审计意见
  - 估值
  - 市盈率
  - 投资回报
  - 资本结构
  - 偿债能力
  - 风险敞口
anti_leakage_patterns:
  - pattern: "(?:营收|收入|利润|净利润|成本|费用|资产|负债)\\s*(?:约|为|达|共|合计)?\\s*\\d+(?:\\.\\d+)?\\s*(?:万|亿|万元|亿元|元)"
    label: "财务金额数值"
  - pattern: "(?:毛利率|净利率|净利润率|ROE|ROI|回报率|增长率|同比|环比)\\s*(?:为|达|约|超)?\\s*\\d+(?:\\.\\d+)?\\s*%"
    label: "财务比率/增长率数值"
  - pattern: "(?:市盈率|市净率|PE|PB|估值)\\s*(?:约|为|达)?\\s*\\d+(?:\\.\\d+)?\\s*(?:倍|亿|万元)?"
    label: "估值倍数/金额"
reading_hints_base: |
  财务金融文档重点关注：
  1. 财务/金融事项的业务背景与目标（如预算、审计、投融资）；
  2. 核心报表科目与口径定义、会计政策；
  3. 关键财务/金融指标的构成与变动原因（具体数值只进入key_numbers）；
  4. 内控/合规/风险控制要点；
  5. 结论与决策建议（投资、预算调整、风险处置等）。
title_slide_fields:
  - "文档标题:"
  - "编制人/部门:"
  - "所属机构/公司:"
  - "报告期/日期:"
document_categories:
  - 财务分析报告
  - 预算方案
  - 审计与内控报告
  - 投融资/估值报告
