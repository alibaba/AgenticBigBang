secondary: "烹饪食谱"
document_type_label: "烹饪食谱/厨艺教学材料"
reading_hints: |
  烹饪食谱文档通常包含：菜品概况与特点、食材清单与处理方式、
  烹饪步骤与关键技法、火候与时间控制、摆盘与出品标准、
  变化版本与常见问题。
  关注：食材比例与用量关系（具体数值只进入key_numbers）；
  不同烹饪手法的区分（爆炒vs慢炖、生炸vs过油等）。
extra_anti_leakage_patterns:
  - pattern: "\\d+\\s*(?:克|g|ml|毫升|个|只|片|斤|两)"
    label: "食材用量数值"
  - pattern: "(?:油温|水温)\\s*(?:约|达到|保持)?\\s*\\d+\\s*(?:℃|度)"
    label: "烹饪温度数值"
  - pattern: "(?:炒|炸|煮|焖|蒸)\\s*\\d+\\s*(?:分钟|秒)"
    label: "烹饪时长数值"
title_slide_fields:
  - "菜品名称:"
  - "作者/厨师:"
  - "出处:"
