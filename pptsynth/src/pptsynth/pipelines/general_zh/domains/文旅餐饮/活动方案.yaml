secondary: "活动方案"
document_type_label: "活动策划/执行方案"
reading_hints: |
  活动方案文档通常包含：活动背景与目的、活动主题与形式、
  时间地点与规模预计、活动流程与环节设计、资源需求与预算安排、
  宣传推广方案、应急预案。
  关注：活动各环节的时间安排与逻辑顺序（具体数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:预计|计划|目标)\\s*(?:参与|吸引|覆盖)\\s*\\d+\\s*(?:万|千)?\\s*(?:人|人次)"
    label: "活动预计参与规模"
title_slide_fields:
  - "活动名称:"
  - "策划方:"
  - "日期:"
