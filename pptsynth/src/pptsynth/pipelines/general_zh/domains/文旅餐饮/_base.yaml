primary: "文旅餐饮"
domain_terminology:
  - 目的地旅游
  - 文旅融合
  - 景区管理
  - 品牌授权
  - 加盟体系
  - 餐饮标准化
  - 客流量
  - 人均消费
  - 活动策划
  - 旅游资源
anti_leakage_patterns:
  - pattern: "(?:客流量|游客量|接待量)\\s*(?:约|达到|超)\\s*\\d+\\s*(?:万|千)?\\s*(?:人次|人)"
    label: "旅游客流量数值"
  - pattern: "(?:人均消费|客单价|翻台率)\\s*(?:约|为)\\s*\\d+"
    label: "餐饮/消费数值"
  - pattern: "(?:营业额|营收|收入)\\s*(?:约|达到|超)\\s*\\d+\\s*(?:万|亿)元"
    label: "营业额/营收数值"
reading_hints_base: |
  文旅餐饮文档重点关注：
  1. 核心产品/服务的定位与特色；
  2. 目标客群与市场分析；
  3. 商业模式与运营方案；
  4. 经营数据与市场表现（数值只进入key_numbers）；
  5. 品牌故事与竞争优势。
title_slide_fields:
  - "文档标题:"
  - "出品方/单位:"
  - "日期:"
