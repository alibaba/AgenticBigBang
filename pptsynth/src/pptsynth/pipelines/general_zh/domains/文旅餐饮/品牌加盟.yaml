secondary: "品牌加盟"
document_type_label: "餐饮/文旅品牌加盟招商材料"
reading_hints: |
  品牌加盟文档通常包含：品牌故事与市场定位、加盟模式与支持体系、
  门店标准与选址要求、财务测算模型（含具体投资回收期等数值）、
  成功案例与加盟商背书、加盟流程。
  关注：不同加盟类型（直营/标准加盟/特许等）的费用结构差异（数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:加盟费|特许费|保证金)\\s*(?:为|约)?\\s*\\d+\\s*(?:万元|元)"
    label: "加盟费用数值"
  - pattern: "(?:投资回收期|回本周期)\\s*(?:约|为)?\\s*\\d+\\s*(?:个月|年)"
    label: "投资回收期"
title_slide_fields:
  - "品牌名称:"
  - "出品方:"
  - "日期:"
