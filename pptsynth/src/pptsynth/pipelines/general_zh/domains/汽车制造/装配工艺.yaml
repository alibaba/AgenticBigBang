secondary: "装配工艺"
document_type_label: "汽车装配工艺/制造规程材料"
reading_hints: |
  装配工艺文档通常包含：装配流程与工序说明、关键工序的工艺要求与参数、
  工装夹具与设备说明、质量控制点与检测标准、典型缺陷与防错措施。
  关注：不同工序的顺序与依赖关系（先后顺序约束），
  关键尺寸/扭矩等技术参数（数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:扭矩|拧紧力矩)\\s*(?:为|约|要求)?\\s*\\d+(?:\\.\\d+)?\\s*(?:N·m|Nm|牛米)"
    label: "拧紧扭矩规格值"
