primary: "汽车制造"
domain_terminology:
  - 动力总成
  - 整备质量
  - 续航里程
  - 电池容量
  - 生产节拍
  - 供应链管理
  - 质量体系
  - 工艺标准
  - 零部件配套
  - 制造工艺
  - 新能源汽车
  - IATF16949
anti_leakage_patterns:
  - pattern: "(?:续航|续航里程)\\s*(?:约|达|最高)?\\s*\\d+\\s*(?:km|公里|千米)"
    label: "续航里程数值"
  - pattern: "(?:百公里加速|0-100km/h)\\s*(?:约|为)?\\s*\\d+\\.\\d+\\s*(?:秒|s)"
    label: "加速性能数值"
  - pattern: "(?:产能|产量|销量)\\s*(?:约|达到|超过)?\\s*\\d+\\s*(?:万|千)?\\s*(?:辆|台)"
    label: "产销量数值"
reading_hints_base: |
  汽车制造文档重点关注：
  1. 产品/技术核心参数与规格；
  2. 工艺流程或质量控制要点；
  3. 供应链结构或问题分析；
  4. 性能数据与行业对比（具体数值只进入key_numbers）；
  5. 技术路线选择依据。
title_slide_fields:
  - "文档标题:"
  - "汇报人/团队:"
  - "所属部门:"
  - "日期:"
