primary: "教育培训"
domain_terminology:
  - 教学目标
  - 学习目标
  - 教学设计
  - 课程大纲
  - 知识点
  - 教学环节
  - 学情分析
  - 形成性评价
  - 终结性评价
  - 考核方案
  - 课时
  - 布鲁姆分类
  - 教务管理
  - 选排课
  - 学分
  - 教学评估
  - 差异化教学
  - 作业与练习
anti_leakage_patterns:
  - pattern: "(?:通过率|优良率|及格率|达标率|满意度|参与率)\\s*(?:为|达|约|超)?\\s*\\d+(?:\\.\\d+)?\\s*%"
    label: "教学效果率数值"
  - pattern: "(?:课时|学时|学分)\\s*(?:约|为|达|共|合计)?\\s*\\d+(?:\\.\\d+)?\\s*(?:课时|学时|学分|节)"
    label: "课时/学分数值"
  - pattern: "(?:学员|学生|班级|参训人数)\\s*(?:约|为|达|共)?\\s*\\d+(?:\\.\\d+)?\\s*(?:人|名|个班)"
    label: "学员规模数值"
reading_hints_base: |
  教育/培训文档重点关注：
  1. 教学/培训目标与受众（学情/岗位需求）；
  2. 课程结构、知识点顺序与教学环节设计；
  3. 考核/评价方案与效果指标（具体数值只进入key_numbers）；
  4. 教学资源、活动与作业练习安排；
  5. 教务管理与改进建议。
title_slide_fields:
  - "文档标题:"
  - "授课人/设计者:"
  - "所属院校/机构:"
  - "学期/日期:"
document_categories:
  - 教学设计
  - 课程开发
  - 学情/评价分析
  - 教务管理
