primary: "文娱创意"
domain_terminology:
  - 剧本
  - 分镜
  - 后期制作
  - 票房
  - IP授权
  - 世界观设定
  - 角色设计
  - 关卡设计
  - 美术风格
  - 创意简报
  - 用户画像
  - 内容运营
anti_leakage_patterns:
  - pattern: "(?:票房|营收|流水|收入)\\s*(?:达|为|超|突破)?\\s*\\d+(?:\\.\\d+)?\\s*(?:万|亿|万元|亿元)"
    label: "票房/营收金额"
  - pattern: "(?:播放量|观看量|下载量|用户数)\\s*(?:达|超|突破)?\\s*\\d+(?:\\.\\d+)?\\s*(?:万|亿)"
    label: "播放/下载量数值"
  - pattern: "(?:评分|口碑)\\s*(?:达|为)?\\s*\\d+(?:\\.\\d+)?\\s*(?:分|星)"
    label: "评分数值"
reading_hints_base: |
  文娱/创作文档重点关注：
  1. 创意概念/世界观与目标受众定位；
  2. 内容结构、叙事线或玩法设计；
  3. 视觉风格、美术参考与技术实现方案；
  4. 市场表现数据（具体数值只进入key_numbers）；
  5. 运营策略、IP开发与商业化路径。
title_slide_fields:
  - "项目/作品标题:"
  - "制作方/团队:"
  - "导演/制作人:"
  - "日期:"
document_categories:
  - 影视项目方案
  - 游戏设计文档
  - 创意设计方案
  - IP运营方案
