primary: "体育运动"
domain_terminology:
  - 赛事策划
  - 运动健康
  - 俱乐部运营
  - 体育产业
  - 竞技表现
  - 训练计划
  - 运动损伤
  - 健身方法
  - 赛事运营
  - 体育营销
anti_leakage_patterns:
  - pattern: "(?:参赛|参与|招募)\\s*(?:人数|人次|队伍)\\s*(?:约|共|预计)?\\s*\\d+"
    label: "活动参与规模数值"
  - pattern: "(?:赞助|赛事预算|运营费用)\\s*(?:约|为|共)?\\s*\\d+\\s*(?:万|元)"
    label: "赛事经费数值"
reading_hints_base: |
  体育运动文档重点关注：
  1. 活动/赛事/方案的核心目标与定位；
  2. 执行方案的关键环节与亮点；
  3. 参与规模与商业价值（数值只进入key_numbers）；
  4. 运动科学知识或健康建议的证据基础；
  5. 实施计划与保障措施。
title_slide_fields:
  - "文档标题:"
  - "出品方/机构:"
  - "日期:"
