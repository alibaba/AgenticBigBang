secondary: "俱乐部方案"
document_type_label: "体育俱乐部运营方案/商业计划"
reading_hints: |
  俱乐部方案文档通常包含：俱乐部定位与核心竞争力、会员体系与服务内容、
  场地与设施规划、教练团队与课程体系、商业模式与盈利分析、
  市场推广策略。
  关注：不同会员等级的权益差异（数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:会员费|入会费|月卡|年卡)\\s*(?:约|为|售价)?\\s*\\d+\\s*(?:元|万元)"
    label: "会员费用数值"
