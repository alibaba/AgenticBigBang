secondary: "运动健康"
document_type_label: "运动健康科普/指导材料"
reading_hints: |
  运动健康文档通常包含：运动与健康的关联机制、推荐运动类型与强度、
  不同人群的运动建议、运动损伤预防与处理、科学训练原则与方法。
  关注：不同运动强度（有氧/无氧/HIIT等）的定义与适用人群区分；
  推荐运动频率与时长的科学依据（数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "每(?:周|天|次)\\s*(?:至少|建议|推荐)?\\s*\\d+\\s*(?:分钟|小时|次)"
    label: "运动频率/时长推荐值"
