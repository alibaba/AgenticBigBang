primary: "运营供应链"
domain_terminology:
  - 采购管理
  - 供应商
  - 库存周转
  - 安全库存
  - 物流配送
  - 生产计划
  - 产能
  - 良品率
  - 合格率
  - 交付周期
  - 在制品
  - 精益生产
  - SOP
  - 履约率
  - 补货策略
  - 供应链协同
  - 质量管理体系
  - 工序
anti_leakage_patterns:
  - pattern: "(?:库存周转|交付周期|生产周期|采购周期|提前期)\\s*(?:约|为|达)?\\s*\\d+(?:\\.\\d+)?\\s*(?:天|周|次|月)"
    label: "运营周期/周转数值"
  - pattern: "(?:良品率|合格率|履约率|准时交付率|直通率)\\s*(?:为|达|约|超)?\\s*\\d+(?:\\.\\d+)?\\s*%"
    label: "质量/履约率数值"
  - pattern: "(?:产能|库存量|采购量|发货量)\\s*(?:约|为|达|共)?\\s*\\d+(?:\\.\\d+)?\\s*(?:件|台|吨|万件|pcs)"
    label: "产能/库存数量"
reading_hints_base: |
  运营/供应链文档重点关注：
  1. 运营/供应链目标与业务场景（采购、库存、物流、生产、质检）；
  2. 流程与SOP、关键节点与责任分工；
  3. 核心运营指标及瓶颈分析（具体数值只进入key_numbers）；
  4. 供应商/库存/产能等资源约束与风险；
  5. 改善方案与落地计划。
title_slide_fields:
  - "文档标题:"
  - "负责人/部门:"
  - "所属公司:"
  - "日期/周期:"
document_categories:
  - 采购/供应商报告
  - 库存物流方案
  - 生产运营计划
  - 质量管理报告
