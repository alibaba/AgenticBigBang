primary: "法律合规"
domain_terminology:
  - 法律责任
  - 违约条款
  - 赔偿标准
  - 诉讼时效
  - 合同效力
  - 调解协议
  - 举证责任
  - 行政处罚
  - 合规要求
  - 监管规定
  - 知识产权
  - 劳动法规
anti_leakage_patterns:
  - pattern: "(?:赔偿|罚款|罚金|赔付)\\s*(?:金额|标准)?\\s*(?:为|约|共)?\\s*(?:人民币)?\\s*\\d+"
    label: "法律赔偿/罚款数值"
  - pattern: "(?:诉讼时效|追诉期|有效期)\\s*(?:为|共)\\s*\\d+\\s*(?:年|月|天)"
    label: "法律时效期限"
  - pattern: "第\\s*\\d+\\s*条\\s*(?:规定|约定|明确)"
    label: "具体条文编号（应引用条款内容而非编号）"
reading_hints_base: |
  法律合规文档重点关注：
  1. 适用的法律法规名称与具体条款；
  2. 权利义务关系与责任划分；
  3. 违约/违规的具体法律后果；
  4. 操作合规要点与注意事项；
  5. 典型案例与风险提示。
title_slide_fields:
  - "文档标题:"
  - "主讲人/作者:"
  - "所属机构:"
  - "日期:"
document_categories:
  - 法务培训
  - 合同解读
  - 政策宣讲
  - 纠纷调解
