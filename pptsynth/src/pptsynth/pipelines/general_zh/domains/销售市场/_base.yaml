primary: "销售市场"
domain_terminology:
  - 销售线索
  - 客户跟进
  - 转化率
  - 客单价
  - 获客成本
  - GMV
  - 营销活动
  - 品牌定位
  - 投放渠道
  - ROI
  - 市场份额
  - 用户画像
  - 私域运营
  - 复购率
  - 漏斗模型
  - 增长策略
  - 内容营销
  - 促销机制
anti_leakage_patterns:
  - pattern: "(?:销售额|营收|GMV|成交额)\\s*(?:约|为|达|共)?\\s*\\d+(?:\\.\\d+)?\\s*(?:万|亿|万元|亿元|元)"
    label: "销售金额数值"
  - pattern: "(?:转化率|复购率|留存率|点击率|打开率|市场份额|市占率)\\s*(?:为|达|约|超)?\\s*\\d+(?:\\.\\d+)?\\s*%"
    label: "营销转化/份额数值"
  - pattern: "(?:客单价|获客成本|CAC|ARPU)\\s*(?:约|为|达)?\\s*\\d+(?:\\.\\d+)?\\s*元?"
    label: "客单价/获客成本数值"
reading_hints_base: |
  销售/市场文档重点关注：
  1. 营销/销售目标、目标客群与市场机会；
  2. 策略与打法（渠道组合、内容、促销机制、品牌主张）；
  3. 关键营销/销售指标及其驱动因素（具体数值只进入key_numbers）；
  4. 执行计划、预算分配与节奏；
  5. 效果评估与优化建议。
title_slide_fields:
  - "文档标题:"
  - "负责人/团队:"
  - "所属公司/品牌:"
  - "日期/周期:"
document_categories:
  - 营销方案
  - 品牌推广案
  - 销售复盘报告
  - 市场调研报告
