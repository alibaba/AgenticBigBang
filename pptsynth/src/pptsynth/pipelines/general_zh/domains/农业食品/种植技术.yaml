secondary: "种植技术"
document_type_label: "农作物种植技术材料"
reading_hints: |
  种植技术文档通常包含：品种特性与适种条件、整地备耕技术、
  播种/育苗/移栽方法、施肥与水分管理、病虫草害防治、
  收获时机与方法、产量与效益分析。
  关注：不同生育阶段的技术要点及其对最终产量的不同影响（数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:发芽率|出苗率|成活率)\\s*(?:达到|约为|超过)?\\s*\\d+(?:\\.\\d+)?%"
    label: "种苗成活率数值"
