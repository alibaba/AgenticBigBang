secondary: "烟草"
document_type_label: "烟草种植/行业技术材料"
reading_hints: |
  烟草文档通常包含：烟草品种特性与适种区域、育苗移栽技术、
  大田管理要点（施肥/打顶/采烤）、烟叶品质标准与分级、
  行业政策与生产指标。
  关注：不同烟草品种的特性区分；采烤时机与温度控制的关键节点
  （具体数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:收购价|烟叶价格)\\s*(?:约|为|每公斤)?\\s*\\d+(?:\\.\\d+)?\\s*元"
    label: "烟叶收购价格"
  - pattern: "(?:烟碱|焦油|有害成分)含量\\s*(?:约为|为|不超过)?\\s*\\d+"
    label: "烟草成分含量"
