secondary: "农产品推介"
document_type_label: "农产品推介/品牌宣传材料"
reading_hints: |
  农产品推介文档通常包含：产品产地与生产背景、核心品质特点与检测认证、
  与同类产品的差异化优势、目标市场与消费群体、销售渠道与价格体系。
  关注：不同等级/规格产品的品质区分标准（数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:价格|批发价|零售价)\\s*(?:约|为|每斤|每公斤)?\\s*\\d+(?:\\.\\d+)?\\s*元"
    label: "农产品价格"
