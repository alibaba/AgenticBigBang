primary: "农业食品"
domain_terminology:
  - 种植技术
  - 病虫害防治
  - 农产品品质
  - 食品安全
  - 产量/亩产
  - 土壤改良
  - 施肥方案
  - 品种选育
  - 烟草种植
  - 食品标准
  - 农业机械化
anti_leakage_patterns:
  - pattern: "(?:亩产|产量|单产)\\s*(?:约|达到|为)?\\s*\\d+\\s*(?:公斤|kg|斤|吨/亩)"
    label: "农业产量数值"
  - pattern: "(?:施肥量|用药量|灌溉量)\\s*(?:约|每亩|为)?\\s*\\d+\\s*(?:公斤|kg|ml|升|吨)"
    label: "农业投入品用量数值"
  - pattern: "(?:检出|超标|含量)\\s*(?:率|量)?\\s*(?:为|约|低于|不超过)?\\s*\\d+"
    label: "食品检测数值"
reading_hints_base: |
  农业食品文档重点关注：
  1. 种植/养殖/生产技术的核心方法与关键步骤；
  2. 关键技术指标与质量标准（数值只进入key_numbers）；
  3. 不同品种/技术路线/产品等级的区分；
  4. 风险防控与质量保障措施；
  5. 市场与政策背景。
title_slide_fields:
  - "文档标题:"
  - "作者/机构:"
  - "日期:"
