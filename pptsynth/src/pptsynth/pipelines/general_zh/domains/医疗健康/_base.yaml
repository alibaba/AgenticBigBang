primary: "医疗健康"
domain_terminology:
  - 临床疗效
  - 药品适应症
  - 不良反应
  - 随机对照试验
  - 双盲试验
  - 有效率
  - 治愈率
  - 生存率
  - 用药剂量
  - 禁忌症
  - 诊断标准
  - 循证医学
  - 并发症
  - 预后
anti_leakage_patterns:
  - pattern: "\\d+(?:\\.\\d+)?\\s*(?:mg|ml|mL|μg|g/kg|mg/kg|mcg)"
    label: "药品剂量"
  - pattern: "(?:有效率|治愈率|缓解率|好转率|生存率|存活率)\\s*(?:为|达|约|超)\\s*\\d+"
    label: "医疗疗效率"
  - pattern: "\\d+\\s*(?:例|名|人|位)\\s*(?:患者|受试者|病人)\\s*(?:中|内|中有)"
    label: "病例数量"
  - pattern: "随访\\s*\\d+\\s*(?:个月|年|天|周)"
    label: "随访时间"
reading_hints_base: |
  医疗健康文档重点关注：
  1. 疾病/症状/治疗方法的定义与分类；
  2. 诊断标准与鉴别诊断要点；
  3. 治疗方案的适应症、禁忌症和用法用量；
  4. 疗效数据与安全性数据（具体数值只进入key_numbers）；
  5. 注意事项、不良反应与风险提示。
title_slide_fields:
  - "文档标题:"
  - "主讲人/作者:"
  - "所属机构:"
  - "会议/日期:"
document_categories:
  - 病例报告
  - 医学讲座
  - 药品说明
  - 健康科普
