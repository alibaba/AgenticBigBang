secondary: "病例分享"
document_type_label: "病例报告/病例分享"
reading_hints: |
  病例分享文档通常包含：患者基本信息与主诉、诊断过程、治疗方案选择及依据、
  手术/治疗经过、疗效评估与随访、经验总结与讨论。
  关注：手术/治疗的具体操作要点（不含具体数值）、
  诊断鉴别依据、特殊病例的教学意义。
extra_anti_leakage_patterns:
  - pattern: "(?:术后|治疗后)\\s*\\d+\\s*(?:天|周|月|年)\\s*(?:出院|随访|复查)"
    label: "术后恢复时间节点"
  - pattern: "(?:肿瘤|病灶|结节)\\s*(?:大小|直径|体积)\\s*(?:约|为)\\s*\\d+"
    label: "病灶尺寸数值"
