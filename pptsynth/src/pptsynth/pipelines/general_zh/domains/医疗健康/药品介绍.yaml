secondary: "药品介绍"
document_type_label: "药品介绍/产品推广材料"
reading_hints: |
  药品介绍文档通常包含：药品作用机制、适应症与禁忌症、
  推荐用法用量、关键临床研究数据、安全性与不良反应、
  与同类药物的差异化特点。
  关注：适应症的具体人群限定、关键临床试验设计和终点（数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:主要终点|次要终点)\\s*(?:达到|实现|为)\\s*\\d+"
    label: "临床试验终点数值"
  - pattern: "(?:安全性|不良反应)\\s*(?:发生率)\\s*(?:约|为)\\s*\\d+"
    label: "不良反应发生率"
title_slide_fields:
  - "药品名称:"
  - "生产/推广方:"
  - "演讲人:"
  - "会议/日期:"
