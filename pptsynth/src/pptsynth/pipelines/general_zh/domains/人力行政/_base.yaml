primary: "人力行政"
domain_terminology:
  - 人力资源
  - 绩效考核
  - 薪酬体系
  - 培训发展
  - 组织架构
  - 劳动合同
  - 企业文化
  - 工作流程
  - 制度规范
  - 招聘甄选
  - KPI指标
  - 年度目标
anti_leakage_patterns:
  - pattern: "(?:完成率|达成率|达标率)\\s*(?:达到|为|超)\\s*\\d+(?:\\.\\d+)?%"
    label: "目标完成率"
  - pattern: "(?:人均|月均|年均)\\s*(?:收入|产值|绩效)\\s*(?:约|为|达)\\s*\\d+"
    label: "人均薪酬/绩效数值"
  - pattern: "(?:离职率|留存率|招聘完成率)\\s*(?:为|约|达到)\\s*\\d+"
    label: "人力资源指标数值"
reading_hints_base: |
  人力行政文档重点关注：
  1. 核心工作目标与主要完成情况；
  2. 重点项目与举措；
  3. 量化数据与绩效结果（数值只进入key_numbers）；
  4. 问题与改进方向；
  5. 下期计划与重点工作。
title_slide_fields:
  - "文档标题:"
  - "汇报人/部门:"
  - "汇报日期:"
