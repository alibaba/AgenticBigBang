secondary: "月报周报"
document_type_label: "月度/周度工作报告"
reading_hints: |
  月报/周报文档通常包含：报告期工作概览、重点任务进展（每项附进度状态）、
  数据指标与上期对比、问题与风险提示、下期计划与重点工作。
  关注：各指标的对比基准（与目标对比还是与上期对比）（数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:本周|本月|本期)\\s*(?:完成|新增|处理)\\s*\\d+\\s*(?:个|件|项|条)"
    label: "工作量计数数值"
title_slide_fields:
  - "报告主题:"
  - "汇报人/部门:"
  - "报告周期:"
