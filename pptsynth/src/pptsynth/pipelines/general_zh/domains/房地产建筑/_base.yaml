primary: "房地产建筑"
domain_terminology:
  - 容积率
  - 建筑面积
  - 开发周期
  - 项目规划
  - 施工工艺
  - 竣工验收
  - 设计方案
  - 城市更新
  - 建设指标
  - 销售去化率
anti_leakage_patterns:
  - pattern: "(?:总面积|建筑面积|用地面积|容积率)\\s*(?:为|约|共)?\\s*\\d+"
    label: "建筑/用地面积数值"
  - pattern: "(?:售价|均价|备案价)\\s*(?:约|为)?\\s*(?:每平方米)?\\s*\\d+"
    label: "房价/售价数值"
  - pattern: "(?:去化率|销售率|认购率)\\s*(?:达到|为|超)\\s*\\d+(?:\\.\\d+)?%"
    label: "销售去化数值"
reading_hints_base: |
  房地产建筑文档重点关注：
  1. 项目区位与定位；
  2. 核心设计方案或工程方案；
  3. 建设进度与关键节点；
  4. 工程质量与技术要点；
  5. 预期目标与效益分析。
title_slide_fields:
  - "项目名称:"
  - "汇报单位:"
  - "汇报人:"
  - "日期:"
