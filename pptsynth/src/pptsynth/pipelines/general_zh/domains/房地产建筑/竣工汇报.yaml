secondary: "竣工汇报"
document_type_label: "工程竣工汇报材料"
reading_hints: |
  竣工汇报文档通常包含：工程概况与建设目标、建设过程回顾、
  质量管理与验收情况、安全生产情况、投资控制情况、
  工程亮点与创新点、遗留问题与后期维护安排。
  关注：质量检测指标的合格情况（具体数值只进入key_numbers）。
extra_anti_leakage_patterns:
  - pattern: "(?:工程造价|决算|预算)\\s*(?:约|共|合计)?\\s*(?:人民币)?\\s*\\d+"
    label: "工程造价数值"
