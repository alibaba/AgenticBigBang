# ==============================================================================
# Task Type L2 Definitions
# Mounted under L1_tag_prompt.yaml's 26 Task Type labels
# Each L2: name / authoritative_source / official_definition / operational_definition / signals / boundary_notes
#
# IMPORTANT: All official_definition fields are direct quotes or close paraphrases
# from the cited authoritative source. No fabrication.
# ==============================================================================

# ═══════════════════════════════════════════════════════════════════════════════
# L1: bug-fix
# Framework: CWE (Common Weakness Enumeration) - MITRE Corporation
# ═══════════════════════════════════════════════════════════════════════════════
bug-fix:
  source_framework: "CWE (Common Weakness Enumeration), MITRE Corporation, cwe.mitre.org"
  l2:
    - name: logic_error
      authoritative_source: "CWE-682: Incorrect Calculation; CWE-697: Incorrect Comparison"
      official_definition: |
        CWE-682: "The product performs a calculation that generates incorrect or unintended results
        that are later used in security-critical decisions or resource management."
        CWE-697: "The product compares two entities in a way that produces incorrect results."
      operational_definition: |
        A bug where the code's logical conditions, arithmetic operations, or comparison operators
        produce incorrect results. Includes wrong boolean conditions (AND vs OR), off-by-one in
        non-array contexts, incorrect formula implementations, and flawed state machine transitions.
      signals:
        - "wrong condition in if/else"
        - "incorrect calculation"
        - "comparison operator error (< vs <=, == vs ===)"
        - "algorithm produces wrong output"
        - "business logic flaw"
      boundary_notes: |
        vs off_by_one: off_by_one is specifically about array/loop index boundaries.
        vs state_corruption: state_corruption is about unintended mutation, not incorrect logic.

    - name: null_reference
      authoritative_source: "CWE-476: NULL Pointer Dereference"
      official_definition: |
        "A NULL pointer dereference occurs when the application dereferences a pointer that it
        expects to be valid, but is NULL, typically causing a crash or exit."
      operational_definition: |
        A bug where code accesses a property or method on a null, undefined, nil, or None value
        without proper guard checks, causing runtime crashes (NullPointerException, TypeError,
        segfault, AttributeError on NoneType).
      signals:
        - "NullPointerException"
        - "TypeError: Cannot read properties of null/undefined"
        - "nil pointer dereference"
        - "AttributeError: 'NoneType' object has no attribute"
        - "segmentation fault from null access"
      boundary_notes: |
        vs improper_validation: null_reference is about dereferencing null values at runtime;
        improper_validation is about failing to reject invalid input at the boundary.

    - name: race_condition
      authoritative_source: "CWE-362: Concurrent Execution using Shared Resource with Improper Synchronization ('Race Condition')"
      official_definition: |
        "The product contains a code sequence that can run concurrently with other code, and the
        code sequence requires temporary, exclusive access to a shared resource, but a timing
        window exists in which the shared resource can be modified by another code sequence."
      operational_definition: |
        A bug arising from concurrent access to shared state without proper synchronization.
        Includes data races, TOCTOU (time-of-check-to-time-of-use) vulnerabilities, deadlocks
        caused by incorrect lock ordering, and lost updates in database transactions.
      signals:
        - "data race"
        - "deadlock"
        - "TOCTOU"
        - "concurrent modification exception"
        - "lock ordering issue"
        - "goroutine leak / channel deadlock"
      boundary_notes: |
        vs state_corruption: race_condition requires concurrency; state_corruption can occur
        in single-threaded code through unintended mutation.

    - name: type_mismatch
      authoritative_source: "CWE-704: Incorrect Type Conversion or Cast"
      official_definition: |
        "When the product does not correctly convert an entity of one type into an entity of
        another type, this can introduce resultant weaknesses. This typically occurs when an object
        is converted to a type that is not the correct type."
      operational_definition: |
        A bug caused by wrong type casts, implicit type coercion errors, generic type parameter
        mismatches, or interface/protocol conformance failures. Results in ClassCastException,
        TypeError, truncated data, or precision loss.
      signals:
        - "ClassCastException"
        - "TypeError: expected X got Y"
        - "invalid type assertion"
        - "wrong generic type parameter"
        - "integer overflow from narrowing cast"
      boundary_notes: |
        vs logic_error: type_mismatch is specifically about type system violations;
        logic_error is about incorrect semantic behavior with correct types.

    - name: resource_leak
      authoritative_source: "CWE-664: Improper Control of a Resource Through its Lifetime"
      official_definition: |
        "The product does not maintain or incorrectly maintains control over a resource throughout
        its lifetime of creation, use, and release."
      operational_definition: |
        A bug where resources (memory, file handles, database connections, sockets, goroutines)
        are acquired but not properly released, leading to gradual exhaustion. Includes missing
        close/free calls, missing finally/defer blocks, and unbounded growth of internal caches.
      signals:
        - "memory leak"
        - "file handle not closed"
        - "connection pool exhausted"
        - "goroutine/thread leak"
        - "missing defer/finally/using"
      boundary_notes: |
        vs state_corruption: resource_leak is about lifetime management;
        state_corruption is about incorrect values in live objects.

    - name: injection_xss
      authoritative_source: "CWE-707: Improper Neutralization"
      official_definition: |
        "The product does not ensure or incorrectly ensures that structured messages or data are
        well-formed and that certain security properties are met before being read from an upstream
        component or sent to a downstream component."
      operational_definition: |
        A bug-fix that addresses injection vulnerabilities: SQL injection (CWE-89), Cross-site
        Scripting XSS (CWE-79), OS command injection (CWE-78), or path traversal (CWE-22).
        The fix typically adds input sanitization, parameterized queries, or output encoding.
      signals:
        - "SQL injection fix"
        - "XSS sanitization"
        - "command injection prevention"
        - "path traversal fix"
        - "parameterized query"
        - "html escaping"
      boundary_notes: |
        vs security-fix.injection: When the primary intent is fixing a functional bug that happens
        to be an injection → bug-fix.injection_xss. When the primary intent is a security audit
        finding → security-fix.injection. Use task context to disambiguate.

    - name: improper_validation
      authoritative_source: "CWE-20: Improper Input Validation"
      official_definition: |
        "The product receives input or data, but it does not validate or incorrectly validates
        that the input has the properties that are required to process the data safely and
        correctly."
      operational_definition: |
        A bug where the code accepts malformed, out-of-range, or semantically invalid input
        because validation checks are missing or insufficient. The fix adds boundary checks,
        format validation, length limits, or type constraints at system boundaries.
      signals:
        - "missing input validation"
        - "boundary check added"
        - "invalid format accepted"
        - "length limit not enforced"
        - "schema validation missing"
      boundary_notes: |
        vs null_reference: null_reference is a specific case of dereferencing null;
        improper_validation is broader (any invalid input shape).
        vs enhancement.add_validation: If existing code crashed due to missing validation = bug-fix;
        if code worked but could be more robust = enhancement.

    - name: exception_handling
      authoritative_source: "CWE-703: Improper Check or Handling of Exceptional Conditions"
      official_definition: |
        "The product does not properly anticipate or handle exceptional conditions that rarely
        occur during normal operation of the product."
      operational_definition: |
        A bug where exceptions or errors are improperly handled: swallowed silently (empty catch),
        caught too broadly (catching Exception/Throwable), not propagated to callers, or where
        error recovery logic is itself broken. The fix improves error handling fidelity.
      signals:
        - "empty catch block"
        - "swallowed exception"
        - "overly broad except clause"
        - "error not propagated"
        - "finally block missing cleanup"
      boundary_notes: |
        vs enhancement.improve_error_handling: If the code crashes/misbehaves due to bad error
        handling = bug-fix. If error handling works but messages could be friendlier = enhancement.

    - name: state_corruption
      authoritative_source: "CWE-471: Modification of Assumed-Immutable Data (MAID)"
      official_definition: |
        "The product does not properly protect an assumed-immutable element from being modified
        by an attacker or by another part of the code."
      operational_definition: |
        A bug where object/variable state is unexpectedly modified, leading to inconsistency.
        Includes unintended shared mutable state, stale cache entries, failed transaction
        rollbacks, and aliasing bugs where modifying one reference affects another.
      signals:
        - "stale state / stale cache"
        - "shared mutable state bug"
        - "transaction not rolled back"
        - "unintended aliasing"
        - "dirty read / inconsistent view"
      boundary_notes: |
        vs race_condition: state_corruption can happen in single-threaded code;
        race_condition requires concurrent execution.

    - name: off_by_one
      authoritative_source: "CWE-193: Off-by-one Error"
      official_definition: |
        "A product calculates or uses an incorrect maximum or minimum value that is 1 more, or
        1 less, than the correct value."
      operational_definition: |
        A bug specifically involving array index boundaries, loop iteration counts, or string
        length calculations that are off by exactly one. Results in ArrayIndexOutOfBounds,
        buffer over-read by one byte, or missing the last/first element in iteration.
      signals:
        - "ArrayIndexOutOfBoundsException"
        - "fence post error"
        - "< vs <= in loop"
        - "i+1 vs i"
        - "buffer overread by 1"
      boundary_notes: |
        vs logic_error: off_by_one is specifically ±1 boundary errors;
        logic_error covers broader incorrect calculations.

    - name: lifecycle_serialization
      authoritative_source: "CWE-664: Improper Control of a Resource Through its Lifetime (Pillar) — encompassing CWE-666 Operation on Resource in Wrong Phase and CWE-672 Operation on a Resource after Expiration"
      official_definition: |
        CWE-664: "The product does not maintain or incorrectly maintains control over a resource
        throughout its lifetime of creation, use, and release." Includes objects that cannot be
        serialized/persisted/replayed correctly across lifecycle phases, framework lifecycle
        hooks misfiring on edge-case object states, and configuration defaults that produce
        inconsistent state between phases.
      operational_definition: |
        Bugs caused by an object/resource being used in a state or phase where its lifecycle
        contract is broken. Concretely covers: (1) serialization/deserialization failures
        (pickle of unpicklable weakrefs in matplotlib, JSON roundtrip mismatch); (2) framework
        lifecycle interaction bugs (Django template engine auto-calling enum classes that
        require args; deprecated command still appearing in completion/help systems);
        (3) configuration default values that produce inconsistent state across phases or
        environments (FILE_UPLOAD_PERMISSIONS=None giving different permissions depending on
        which OS-tempfile path was used).
      signals:
        - "pickle / serialization failure"
        - "JSON / protobuf roundtrip mismatch"
        - "framework hook fires on wrong object state (template engine, lifecycle callbacks)"
        - "deprecated command still in help/completion"
        - "default value None causing inconsistent state across runs/OSes"
        - "weakref / proxy not survivable across boundary"
      boundary_notes: |
        vs resource_leak: resource_leak is unbounded growth from missing release; lifecycle_
        serialization is wrong-phase / wrong-state operation on a resource (no leak required).
        vs state_corruption: state_corruption is unintended mutation of live state;
        lifecycle_serialization is failure to correctly transition state across lifecycle
        boundaries (serialize, restore, deprecate, default-init).
        vs enhancement.internal_improvement: if the old default just produced a less-safe but
        still-working behavior → enhancement.internal_improvement. If the inconsistency is a
        reported defect → bug-fix.lifecycle_serialization.

# ═══════════════════════════════════════════════════════════════════════════════
# L1: performance-fix
# Framework: ISO/IEC 25010:2023 - Performance Efficiency quality characteristic
# ═══════════════════════════════════════════════════════════════════════════════
performance-fix:
  source_framework: "ISO/IEC 25010:2023, Quality in use model — Performance Efficiency"
  l2:
    - name: query_optimization
      authoritative_source: "ISO 25010 → Time Behaviour; Database indexing theory (Elmasri & Navathe)"
      official_definition: |
        ISO 25010 Time Behaviour: "Degree to which the response and processing times and
        throughput rates of a product or system meet requirements when performing its functions."
        Applied specifically to database query execution paths.
      operational_definition: |
        Fix slow database queries by adding/modifying indexes, rewriting inefficient SQL (e.g.,
        eliminating N+1 queries, replacing correlated subqueries with JOINs), or optimizing
        query plans. The bottleneck is specifically in data retrieval layer.
      signals:
        - "slow query"
        - "missing index"
        - "N+1 query"
        - "full table scan"
        - "EXPLAIN ANALYZE"
        - "query plan optimization"
      boundary_notes: |
        vs algorithm_complexity: query_optimization is database-specific;
        algorithm_complexity is for in-memory algorithmic improvements.

    - name: caching
      authoritative_source: "ISO 25010 → Time Behaviour"
      official_definition: |
        Applying memoization or caching layers to reduce redundant computation or I/O,
        directly improving response time as defined by ISO 25010 Time Behaviour.
      operational_definition: |
        Add or optimize caching to avoid redundant work: HTTP cache headers, application-level
        caching (Redis/Memcached), function memoization, CDN configuration, or cache
        invalidation strategy fixes.
      signals:
        - "cache miss rate high"
        - "add Redis/Memcached"
        - "memoize function"
        - "HTTP Cache-Control headers"
        - "CDN configuration"
        - "cache invalidation fix"
      boundary_notes: |
        vs lazy_loading: caching stores computed results; lazy_loading defers computation.

    - name: lazy_loading
      authoritative_source: "ISO 25010 → Resource Utilization"
      official_definition: |
        ISO 25010 Resource Utilization: "Degree to which the amounts and types of resources used
        by a product or system meet requirements when performing its functions."
        Applied via deferred resource loading patterns.
      operational_definition: |
        Defer loading of resources until actually needed: code splitting (dynamic import),
        lazy component loading, image lazy loading, virtual scrolling for large lists,
        or database lazy fetch strategies.
      signals:
        - "dynamic import / code splitting"
        - "React.lazy"
        - "Intersection Observer for images"
        - "virtual scroll"
        - "lazy fetch / deferred loading"
      boundary_notes: |
        vs caching: lazy_loading defers the first load; caching avoids repeated loads.

    - name: algorithm_complexity
      authoritative_source: "ISO 25010 → Time Behaviour; Cormen et al., Introduction to Algorithms (CLRS)"
      official_definition: |
        Improving asymptotic time or space complexity of algorithms, directly impacting
        Time Behaviour per ISO 25010. CLRS defines complexity via Big-O/Theta notation.
      operational_definition: |
        Replace an algorithm with a more efficient one: O(n²) → O(n log n), linear search →
        hash lookup, naive recursion → dynamic programming, unnecessary nested loops eliminated.
      signals:
        - "O(n²) to O(n)"
        - "HashMap instead of linear search"
        - "binary search"
        - "dynamic programming"
        - "reduce nested loops"
      boundary_notes: |
        vs query_optimization: algorithm_complexity is for in-memory/CPU-bound algorithms;
        query_optimization is for database I/O.

    - name: memory_optimization
      authoritative_source: "ISO 25010 → Resource Utilization"
      official_definition: |
        ISO 25010 Resource Utilization applied to memory: reducing peak or sustained memory
        consumption while maintaining functional equivalence.
      operational_definition: |
        Reduce memory footprint: object pooling, buffer reuse, arena allocation, reducing
        unnecessary copies, streaming instead of loading all into memory, or right-sizing
        data structures.
      signals:
        - "reduce memory footprint"
        - "object pool"
        - "buffer reuse / arena allocator"
        - "streaming processing"
        - "reduce allocations"
      boundary_notes: |
        vs resource_leak (bug-fix): memory_optimization reduces legitimate memory use;
        resource_leak fixes memory that should have been freed but wasn't.

    - name: batch_processing
      authoritative_source: "ISO 25010 → Capacity"
      official_definition: |
        ISO 25010 Capacity: "Degree to which the maximum limits of a product or system parameter
        meet requirements." Batch processing improves throughput capacity.
      operational_definition: |
        Replace item-by-item processing with batch operations: bulk database inserts, batch
        API calls, chunk-based file processing, or pagination optimization to handle larger
        data volumes efficiently.
      signals:
        - "batch insert"
        - "bulk API request"
        - "chunk processing"
        - "pagination optimization"
        - "streaming batch"
      boundary_notes: |
        vs concurrency_parallelism: batch_processing groups sequential operations;
        concurrency_parallelism executes operations simultaneously.

    - name: concurrency_parallelism
      authoritative_source: "ISO 25010 → Time Behaviour; Herlihy & Shavit, The Art of Multiprocessor Programming"
      official_definition: |
        Leveraging concurrent or parallel execution to improve throughput, per ISO 25010
        Time Behaviour. Herlihy & Shavit define parallelism as "using multiple processors
        to solve a problem faster."
      operational_definition: |
        Introduce or optimize concurrent/parallel execution: async/await, thread pools, worker
        pools, goroutines, parallel map/reduce, or SIMD vectorization to improve throughput.
      signals:
        - "async/await optimization"
        - "thread pool / worker pool"
        - "parallel processing"
        - "concurrent.futures"
        - "goroutine / channel"
      boundary_notes: |
        vs batch_processing: concurrency_parallelism runs things simultaneously;
        batch_processing groups sequential operations.

