config_id: mopd
model_architecture: dense_27b
data_manifest: data/manifests/mopd_training_records.csv
parameters:
  seed: 42
  rollout_batch_size: 128
  num_return_sequences_in_group: 1
  sequence_length: 131072
  max_actions_per_traj: 150
  max_tokens_per_step: 12288
  max_steps: 500
  enable_no_replacement_sampling: true
  train_dataset_sample_mode: shuffle_traversal
  async_generation_ratio: 1
  adv_estimator: reinforce
  ratio_type: token
  ppo_epochs: 1
  dual_clip_loss: false
  whiten_advantages: false
  entropy_loss_coef: 0.0
  pg_clip: 0
  advantage_clip: 5.0
  use_kl_loss: false
  add_token_level_kl: false
  kl_penalty: kl
  init_kl_coef: 0
  max_grad_norm: 20
  loss_agg_mode: seq-mean-segment-sum
  filter_trajectories_by_stop_reason: false
  cap_reward_for_non_submit: false
  skip_mock_system_prompt: true
  enable_thinking: true
  is_pure_opd: true
  partial_f2p_reward: false
  enable_step_reward_fusion: false
  enable_per_step_advantage: false
reward_normalization:
  grouping: traj_group_id
  norm_mean_type: rloo
  norm_std_type: null
student_train:
  model_args:
    flash_attn: sdpa
    attn_implementation: sdpa
    disable_gradient_checkpointing: false
    dtype: bf16
    freeze_module_prefix: vision_model
  training_args:
    learning_rate: 3.0e-06
    weight_decay: 0.01
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 64
    warmup_steps: 0
    lr_scheduler_type: cosine
  execution_parameters:
    use_distributed_optimizer: true
    recompute_granularity: full
    bias_activation_fusion: true
    apply_rope_fusion: true
    bf16: true
student_infer:
  model_args:
    flash_attn: fa2
    attn_implementation: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 12288
    top_p: 0.95
    top_k: 20
    num_beams: 1
    temperature: 1.0
    num_return_sequences: 1
    stop_strings:
    - </tool_call>
  execution_parameters:
    max_model_len: 131072
    gpu_memory_utilization: 0.6
    max_num_batched_tokens: 65536
    block_size: 16
    optimization_level: 1
exopd_reference:
  model_args:
    flash_attn: sdpa
    attn_implementation: sdpa
    disable_gradient_checkpointing: true
    dtype: bf16
  execution_parameters:
    use_distributed_optimizer: true
    recompute_granularity: full
    bias_activation_fusion: true
    apply_rope_fusion: true
    bf16: true
teachers:
  A:
    model_args:
      flash_attn: sdpa
      attn_implementation: sdpa
      disable_gradient_checkpointing: true
      dtype: bf16
    execution_parameters:
      use_distributed_optimizer: true
      recompute_granularity: full
      bias_activation_fusion: true
      apply_rope_fusion: true
      bf16: true
    tag_included:
    - A
    opd_kl_coef: 1.0
    exopd_lambda: 1.25
  B:
    model_args:
      flash_attn: sdpa
      attn_implementation: sdpa
      disable_gradient_checkpointing: true
      dtype: bf16
    execution_parameters:
      use_distributed_optimizer: true
      recompute_granularity: full
      bias_activation_fusion: true
      apply_rope_fusion: true
      bf16: true
    tag_included:
    - B
    opd_kl_coef: 1.0
    exopd_lambda: 1.25
  C:
    model_args:
      flash_attn: sdpa
      attn_implementation: sdpa
      disable_gradient_checkpointing: true
      dtype: bf16
    execution_parameters:
      use_distributed_optimizer: true
      recompute_granularity: full
      bias_activation_fusion: true
      apply_rope_fusion: true
      bf16: true
    tag_included:
    - C
    opd_kl_coef: 1.0
    exopd_lambda: 1.25
reference_role: base_model
parallel_layout_status: not_specified
training_environment:
  max_steps: 150
  max_tokens_per_step: 12288
  max_reset_retry_times: 20
  format_penalty: 0.0
  max_env_time: 7200
  sandbox_memory: 16g
  sandbox_cpus: 4
  git_cleanup_level: medium
  git_remove_tags: after_base
