config_id: pro618_eval
benchmark_id: pro618
artifact_type: parameter_specification
data_manifest: data/manifests/evaluation_tasks.csv
seed: 42
expected_tasks: 618
rollout_batch_size: 618
sequence_length: 200000
max_actions_per_traj: 150
pro_antihack_enabled: true
max_tokens_per_step: 25600
generation:
  max_new_tokens: 25600
  top_p: 0.95
  top_k: 20
  num_beams: 1
  temperature: 1.0
  min_p: 0.0
  presence_penalty: 0.0
  repetition_penalty: 1.0
  num_return_sequences: 1
  stop_strings:
  - </tool_call>
inference:
  backend: vllm
  dtype: bf16
  infer_batch_size: 1
  engine:
    max_model_len: 200000
    gpu_memory_utilization: 0.9
    max_num_batched_tokens: 131072
    block_size: 16
    load_format: auto
    tensor_parallel_size: 4
    optimization_level: 1
    attention_config:
      backend: null
rpc_timeout: 7200
skip_mock_system_prompt: true
enable_thinking: true
sandbox:
  memory: 16g
  cpus: 4
environment:
  pro_antihack_enabled: true
  max_reset_retry_times: 20
  format_penalty: 0.0
  max_env_time: 10000
  git_cleanup_level: none
  git_remove_tags: none
  enable_dynamic_sampling: false
  enable_no_replacement_sampling: false
  strict_eval_new_sandbox: true
  dump_model_patch: true
prompt_templates: configs/evaluation/prompts/pro_r2e.yaml
prompt_and_tools_status: System, task, observation, and final-step templates and
  textual tool specifications are included. Referenced tool implementation files
  and the environment backend are not included.
