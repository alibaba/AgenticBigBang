      signals:
        - "argparse / click / typer"
        - "cobra.Command / rootCmd"
        - "clap / #[command]"
        - "commander.js"
        - "terminal output formatting"
      boundary_notes: |
        vs feature.new_command (Task Type): pkg_manager_cli.cli_app is the domain;
        new_command is the task type. Different dimensions.

