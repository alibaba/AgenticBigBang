# ═══════════════════════════════════════════════════════════════════════════════
# L1: security_auth
# Framework: OWASP + CWE + NIST Security Standards
# ═══════════════════════════════════════════════════════════════════════════════
security_auth:
  source_framework: "OWASP Foundation; CWE; NIST SP 800 Series"
  l2:
    - name: oauth_oidc
      authoritative_source: "RFC 6749: OAuth 2.0; OpenID Connect Core 1.0"
      official_definition: |
        RFC 6749: "The OAuth 2.0 authorization framework enables a third-party application to
        obtain limited access to an HTTP service."
        OIDC: "OpenID Connect 1.0 is a simple identity layer on top of the OAuth 2.0 protocol."
      operational_definition: |
        Build OAuth/OIDC infrastructure: authorization server implementation, token endpoint,
        client registration, SSO integration, or identity provider configuration.
      signals:
        - "authorization server"
        - "token endpoint / /oauth/token"
        - "OIDC provider"
        - "SSO / Single Sign-On"
        - "client_id / client_secret"
      boundary_notes: |
        vs auth.oauth_oidc (Task Type): security_auth domain is building auth INFRASTRUCTURE;
        auth task type is making CHANGES to auth features.

    - name: rbac_acl
      authoritative_source: "NIST INCITS 359-2004: Role Based Access Control; XACML (OASIS)"
      official_definition: |
        NIST: "In RBAC, permissions are associated with roles, and users are made members of
        appropriate roles, thereby acquiring the roles' permissions."
        XACML: "An OASIS standard XML-based language for access control policies."
      operational_definition: |
        Build access control systems: role hierarchy design, permission assignment engines,
        ABAC policy engines (OPA, Casbin), or ACL infrastructure.
      signals:
        - "role / permission engine"
        - "OPA / Open Policy Agent"
        - "Casbin / policy model"
        - "ACL / access control list"
        - "XACML / ABAC engine"
      boundary_notes: |
        vs auth.rbac_abac (Task Type): security_auth.rbac_acl is the domain (building the system);
        auth.rbac_abac is the task type (making changes to it).

    - name: crypto_impl
      authoritative_source: "NIST FIPS 140-3; RFC 5246 (TLS); OpenSSL Documentation"
      official_definition: |
        FIPS 140-3: "Security Requirements for Cryptographic Modules... specifies the security
        requirements that are to be satisfied by a cryptographic module utilized within a
        security system."
      operational_definition: |
        Cryptographic implementation: encryption/decryption routines, digital signature
        implementation, key derivation functions, TLS/SSL library usage, or cryptographic
        protocol implementation.
      signals:
        - "AES / RSA / ECDSA"
        - "SHA-256 / HMAC"
        - "key derivation / PBKDF2"
        - "OpenSSL / libsodium"
        - "TLS / certificate"
      boundary_notes: |
        vs security-fix.crypto_weakness (Task Type): crypto_impl is the domain (crypto work);
        crypto_weakness is fixing vulnerabilities in crypto code.

    - name: security_scanning
      authoritative_source: "OWASP DAST/SAST Guide; Snyk Documentation; NIST SP 800-53"
      official_definition: |
        OWASP: "SAST analyzes source code for security vulnerabilities without executing the
        application. DAST tests the running application for vulnerabilities."
        Snyk: "Developer security platform... finds and fixes vulnerabilities in code,
        dependencies, containers, and infrastructure as code."
      operational_definition: |
        Security scanning infrastructure: SAST/DAST tool configuration, dependency vulnerability
        scanning (Snyk, Dependabot), container scanning, or custom security rule development.
      signals:
        - "Snyk / Dependabot"
        - "SAST / DAST configuration"
        - "CVE scanning"
        - "container security scan"
        - "security rule / policy"
      boundary_notes: |
        vs devtools_test: security_scanning is security-specific tooling;
        devtools_test is general development tooling.

    - name: waf_firewall
      authoritative_source: "OWASP ModSecurity Core Rule Set; Cloudflare WAF Documentation"
      official_definition: |
        OWASP CRS: "The OWASP ModSecurity Core Rule Set (CRS) is a set of generic attack
        detection rules for use with ModSecurity or compatible web application firewalls."
      operational_definition: |
        Web application firewall and network security: WAF rule configuration, rate limiting
        implementation, IP blocking/allowlisting, DDoS mitigation, or firewall policy management.
      signals:
        - "WAF rules / ModSecurity"
        - "rate limiting / throttle"
        - "IP blacklist / allowlist"
        - "DDoS mitigation"
        - "Cloudflare / AWS WAF"
      boundary_notes: |
        vs devops_infra.networking: waf_firewall is security-focused filtering;
        networking is general connectivity configuration.

    - name: identity_lifecycle
      authoritative_source: "NIST SP 800-63 series — Digital Identity Guidelines: SP 800-63A (Enrollment & Identity Proofing), SP 800-63B (Authentication & Lifecycle), SP 800-63C (Federation); NIST SP 800-207 — Zero Trust Architecture (device trust); RFC 8705 — Mutual-TLS Client Authentication"
      official_definition: |
        NIST SP 800-63B §5 ("Authenticator Lifecycle") defines a unified framework spanning
        authenticator binding, renewal, loss/theft, expiration, and revocation. NIST SP 800-63C
        adds the corresponding federation/session lifecycle. NIST SP 800-207 §3 introduces
        device-trust as part of identity context. Together these standards treat MFA management,
        session lifecycle, mTLS certificate rotation, and device enrollment as one integrated
        identity-lifecycle subsystem (distinct from the issuance flow itself, which is
        oauth_oidc).
      operational_definition: |
        Work on identity / authenticator / session / device-trust lifecycle management within a
        product whose core mission includes identity (e.g., Teleport, Keycloak admin, Okta-like).
        Concretely covers: MFA device enrollment / removal / recovery (NIST 800-63B §5);
        session creation, renewal, traits-update, revocation (NIST 800-63C); mTLS / X.509 client
        certificate issuance, rotation, revocation (RFC 8705); device-trust enrollment, attestation,
        limit enforcement (NIST 800-207); proxy-routed / cluster-internal authentication paths.
      signals:
        - "MFA device add / remove / list"
        - "session refresh / renew / revoke"
        - "user traits / claims update"
        - "client certificate issuance / rotation"
        - "device enrollment / device trust / attestation"
        - "trust bundle / cluster auth"
      boundary_notes: |
        vs oauth_oidc: oauth_oidc is the *issuance* flow (auth-code grant, token exchange,
        federation handshake); identity_lifecycle is the *post-issuance* management of those
        identities, sessions, and trust artifacts.
        vs rbac_acl: identity_lifecycle is "who you are and for how long";
        rbac_acl is "what you may do" (permissions/policy).
        vs crypto_impl: crypto_impl is the underlying primitives (AES/RSA/HMAC);
        identity_lifecycle uses those primitives at the identity-management layer.

    - name: access_infra
      authoritative_source: "NIST SP 800-207 — Zero Trust Architecture, §3-4 (distinguishes 'policy enforcement point infrastructure' from 'policy decision logic'); Yee, K. P. (2004). Aligning Security and Usability. IEEE S&P — separates transport/connectivity infrastructure from access-control policy"
      official_definition: |
        NIST SP 800-207 §3 defines the Zero Trust Architecture with separate components:
        Policy Engine (decides access), Policy Administrator (establishes sessions), and
        Policy Enforcement Point (enables/terminates connections). The PEP infrastructure —
        proxying, tunneling, routing, HA — is architecturally distinct from policy logic.
      operational_definition: |
        Non-auth infrastructure of an identity/access platform: reverse tunnel / proxy relay
        implementation, high-availability and failover logic, connection routing and multiplexing,
        node discovery and cluster topology, performance optimization and caching, protocol
        adapters (SSH, RDP, K8s API, database wire protocol), and resource serving that enables
        secure access without itself being authentication or authorization logic.
        Example: Teleport's reverse tunnel, proxy peering, HA heartbeat, and desktop streaming
        are access_infra; its MFA enrollment and RBAC engine are identity_lifecycle / rbac_acl.
      signals:
        - "reverse tunnel / proxy relay"
        - "HA / failover / heartbeat / cluster join"
        - "connection routing / multiplexing"
        - "node discovery / inventory sync"
        - "protocol adapter (SSH/RDP/K8s/DB proxy)"
        - "session recording / audit streaming infrastructure"
      boundary_notes: |
        vs identity_lifecycle: identity_lifecycle is managing WHO can access and their credentials;
        access_infra is the plumbing that CARRIES the connections once access is granted.
        vs rbac_acl: rbac_acl decides WHAT is allowed; access_infra routes/proxies traffic.
        vs devops_infra.networking: devops_infra.networking is general infra (Nginx/DNS/CDN);
        access_infra is specifically within a security/access platform product.

# ═══════════════════════════════════════════════════════════════════════════════
# L1: docs_knowledge
# Framework: IEEE Documentation Engineering; Write the Docs community taxonomy
# ═══════════════════════════════════════════════════════════════════════════════
docs_knowledge:
  source_framework: "IEEE Std 1063-2001 (Software User Documentation); Write the Docs community taxonomy of documentation tooling"
  l2:
    - name: doc_generator
      authoritative_source: "IEEE Std 1063-2001 — Standard for Software User Documentation; Sphinx Documentation (sphinx-doc.org); Hugo Documentation (gohugo.io); Docusaurus Documentation (docusaurus.io)"
      official_definition: |
        IEEE 1063-2001 defines documentation tools as software that "automate the production
        of user documentation from source inputs." Sphinx: "Sphinx is a tool that makes it easy
        to create intelligent and beautiful documentation." Hugo: "The world's fastest framework
        for building websites."
      operational_definition: |
        Development of documentation generators, static-site generators, and their plugin/extension
        ecosystems. Covers: Sphinx core engine, directives, domains, builders, and extensions;
        Hugo templating, shortcodes, and module system; Docusaurus plugins, themes, and MDX
        processing; Jekyll plugins, converters, and Liquid extensions; MkDocs plugins and themes;
        any tool whose PRIMARY product is transforming markup/content into publishable documentation.
      signals:
        - "Sphinx directive / domain / builder"
        - "Hugo template / shortcode / .Site"
        - "Docusaurus plugin / @docusaurus/*"
        - "Jekyll converter / Liquid filter"
        - "reStructuredText / .rst processing"
        - "static site generation / content pipeline"
      boundary_notes: |
        vs devtools_test: doc_generator is specifically documentation/content tools;
        devtools_test covers build/test/lint tools for code.
        vs web_frontend: if the work is on the doc tool's ENGINE (how it processes content),
        it's doc_generator; if it's on a React-based doc SITE's custom components, it could
        be web_frontend depending on whether the repo IS Docusaurus (doc_generator) or USES it.

# ═══════════════════════════════════════════════════════════════════════════════
# L1: non_coding — No L2
# ═══════════════════════════════════════════════════════════════════════════════
non_coding:
  source_framework: "N/A"
  l2: null
  rationale: |
    Non-coding tasks (pure discussion, planning, conceptual explanation) are inherently
    diverse and low-volume. Further subdivision would not provide meaningful signal for
    RL training data stratification.

# ═══════════════════════════════════════════════════════════════════════════════
# L1: other — No L2
# ═══════════════════════════════════════════════════════════════════════════════
other:
  source_framework: "N/A — Catch-all"
  l2: null
  rationale: |
    The 'other' label is a catch-all for tasks not fitting any defined domain. By definition,
    it cannot have stable L2 subdivisions.
