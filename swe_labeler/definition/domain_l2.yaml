    - name: cli_app
      authoritative_source: "POSIX.1 §12: Utility Conventions; cobra (Go); click (Python); clap (Rust)"
      official_definition: |
        POSIX: "A utility is called with: utility_name[-option...][operand...]"
        cobra: "A library for creating powerful modern CLI applications."
        click: "A Python package for creating beautiful command line interfaces in a composable way."
      operational_definition: |
        Build CLI applications: argument parsing, subcommand architecture, interactive prompts,
