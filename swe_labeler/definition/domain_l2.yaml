      official_definition: |
        "Cargo is the Rust package manager. Cargo downloads your Rust project's dependencies,
        compiles your project, makes distributable packages, and uploads them to crates.io."
      operational_definition: |
        Work on Rust/Cargo package management: Cargo.toml configuration, feature flags, crate
