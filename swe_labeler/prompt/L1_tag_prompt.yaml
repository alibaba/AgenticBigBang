# Classification Task 3: Application Domain (Canonical) — REPO-CENTRIC

Choose the **single primary** fine-grained domain label. **Domain reflects the PRIMARY PURPOSE OF THE REPOSITORY**, NOT the specific code/file modified in this PR.

## Decision Procedure (follow in order)

### Step 1 — Read repository metadata FIRST (authoritative signal):
- **Repo description** (most authoritative — usually a one-sentence statement of what the project IS)
- **Repo topics** (community-tagged keywords)
- **Repo primary language** (supporting context)

### Step 2 — Form a domain hypothesis based on metadata:
Match the description + topics against the labels below. The description usually contains a phrase like "X platform / framework / library / tool" that maps directly to one domain.

### Step 3 — Use problem_statement and patch as TIE-BREAKERS only:
The PR content should CONFIRM your metadata-based hypothesis (default case). Only use it to disambiguate when the repository legitimately spans multiple domains (e.g., a true monorepo containing both backend and frontend code).

## Critical Rules

- **DO NOT** switch domain based on what code this PR happens to touch. A multiprocessing bug-fix inside Ansible's Python engine is STILL `devops_infra` (Ansible IS an IT-automation platform — see its description). A change to SSH X11 forwarding inside Teleport is STILL `security_auth` (Teleport IS an identity & access platform).
- **DO NOT** treat patches that modify "internal/utility" code as belonging to `devtools_test`. `devtools_test` is reserved for repos whose **product** is a developer tool (Webpack, Jest, ESLint, Faker as a library).
- The same repository should produce the **same** domain across all its PRs (with rare exceptions for true multi-purpose monorepos).
- If metadata is missing (rare), fall back to repo name + PR content; in that case append "(metadata-absent fallback)" to your rationale.

## Available Labels

## Client & UI
- **web_frontend**: Web front-end frameworks, libraries, components, or full web interfaces using any JavaScript/TypeScript UI framework (React, Vue, Angular, Svelte, Mithril, Solid, Preact, vanilla DOM, HTML/CSS-heavy)
- **mobile_dev**: Mobile native or cross-platform applications (Swift, Kotlin, Flutter, React Native)
- **desktop_gui**: Desktop GUI applications (Electron, Tauri, Qt, WPF)

## Backend & Cloud
- **web_backend**: Web back-end frameworks, API services, microservices (Django, Flask, Spring Boot, FastAPI, Express, Axum, Gin, Rails, custom web frameworks)
- **database_storage**: Database systems, ORM, caching, message queues (PostgreSQL, Redis, SQLAlchemy, Kafka)

## AI & Data
- **data_science**: Data science, scientific/numerical/symbolic computing, statistics, machine learning, deep learning, and domain-specific scientific libraries (NumPy, SciPy, SymPy, AstroPy, xarray, pandas, PyTorch, TensorFlow, scikit-learn). Includes computer algebra systems, astronomy/physics libraries, geometric/mathematical software, and any task whose primary nature is numerical or scientific computation.
- **data_engineering**: Data pipelines, ETL, stream processing, big data computing (Spark, Airflow, dbt, Pandas scripts)

## System & Core
- **os_system**: Operating system core, file systems, drivers (Linux kernel, drivers, systemd)
- **iot_embedded**: Embedded systems, firmware, IoT devices (Arduino, RTOS, hardware SDKs)

## DevOps & Infra
- **devops_infra**: Repositories whose **product** is an IT-automation / infrastructure / continuous-monitoring platform — including configuration-management platforms (Ansible, Salt, Chef, Puppet), CI/CD platforms, monitoring/observability stacks (Prometheus, Grafana), vulnerability scanners (Vuls, OpenVAS, Trivy), feature-flag/config-management services (Flipt, LaunchDarkly), Kubernetes ecosystem tools, and IaC tools (Terraform, Pulumi). Use this for the WHOLE repo, regardless of whether a specific PR happens to modify the platform's internal Python/Go engine or the user-facing playbook layer.

## Media & Gaming
- **media_graphics**: Image rendering, audio/video processing, data visualization (FFmpeg, D3.js, Three.js, OpenCV)
- **game_dev**: Game engines, game logic scripting (Unity, Godot, Unreal Engine)

## Tooling & Lang
- **devtools_test**: Repositories whose **product** IS a build tool, testing framework, linter, code formatter, test data generator, or developer productivity tool (Webpack, Jest, Pytest, ESLint, Faker, FactoryBot). **Do NOT use this for repos that merely happen to have internal tooling code** — operations platforms like Ansible / Teleport / Vuls are NOT `devtools_test` even though they contain internal Python/Go engineering code; those belong to `devops_infra` or `security_auth` per their repo product.
- **lang_runtime**: Programming language runtimes, compilers, interpreters, virtual machines, and foundational language ecosystem libraries that extend or complement the standard library — including HTTP client libraries, formatting/serialization libraries, datetime/timezone libraries, collection/data-structure libraries, async/concurrency runtimes, parser/schema libraries, and functional-programming type utilities (CPython, LLVM, TypeScript compiler, Tokio runtime, fmtlib formatting, Gson/nlohmann-json serialization, Carbon/dateutil datetime, immutable-js collections, RxJava reactive streams, requests/httpx/axios HTTP clients, tomlkit/etree parsers, ts-pattern, true-myth, valibot)
- **pkg_manager_cli**: Package managers, command-line utilities, terminal UI (TUI) frameworks, terminal styling/color libraries, and CLI argument parsing libraries (npm, pip, Homebrew, ripgrep, Textual TUI, termenv, optique)

## Business & Web3
- **cms_ecommerce**: Content management systems, e-commerce platforms (WordPress, Shopify, Magento)
- **blockchain_web3**: Smart contracts, blockchain nodes, crypto wallets (Solidity, Hardhat, Web3.js)
- **security_auth**: Repositories whose **product** is an identity / authentication / authorization / access-management / cryptographic platform or library — including bastion / SSO / IAM products (Teleport, Keycloak), OAuth/OIDC providers, secrets-management (Vault), cryptographic libraries (OpenSSL), MFA/WebAuthn services, and security WAFs. Use this for the WHOLE repo regardless of whether a specific PR happens to modify SSH forwarding, session lifecycle, or RBAC engine internals.

## Legacy-compatible docs label
- **docs_knowledge**: Documentation generators, static blogs, wikis (Docusaurus, MkDocs, Hugo). This label is accepted for compatibility and will be post-processed.

## Non-Coding
- **non_coding**: Non-programming tasks — pure discussions, planning, conceptual explanations, or conversations with no code involved

## Other
- **other**: Does not fit any of the above categories

## Repository-Purpose Heuristics (description-keyword → domain)

Use these to map common description phrases:
- "web framework", "API framework", "backend service", "REST/GraphQL server" → web_backend
- "front-end framework", "UI library", "browser components" → web_frontend
- "mobile app", "iOS/Android/Flutter/RN" → mobile_dev
- "desktop GUI", "Electron/Qt/Tauri/WPF" → desktop_gui
- "database", "ORM", "cache", "message broker/queue", "search engine" → database_storage
- "ML/DL framework", "scientific/numerical/symbolic computing", "data science", "computer algebra system" → data_science
- "ETL", "data pipeline", "stream processing", "data warehouse" → data_engineering
- "OS kernel", "filesystem", "drivers" → os_system
- "embedded", "RTOS", "firmware", "IoT" → iot_embedded
- "IT automation platform", "config management", "CI/CD platform", "monitoring/observability", "vulnerability scanner", "feature-flag platform", "infrastructure-as-code" → devops_infra
- "image/video/audio processing", "rendering" → media_graphics
- "game engine", "game framework" → game_dev
- "build tool", "test framework", "linter", "code formatter", "test data generator (as a library)" → devtools_test
- "compiler", "interpreter", "VM", "language tooling", "language standard library extension" → lang_runtime
- "package manager", "CLI utility/launcher" → pkg_manager_cli
- "CMS", "e-commerce platform" → cms_ecommerce
- "blockchain", "smart contract", "DeFi", "Web3" → blockchain_web3
- "identity platform", "auth/SSO", "secrets/cert management", "access management", "bastion/jumpserver", "PAM" → security_auth
- "documentation generator", "static site generator", "wiki" → docs_knowledge

**Guidelines:**
- ALWAYS read repo description + topics first before looking at PR content
- Same repo → same domain across PRs (key consistency check)
- Tests for a React component → `web_frontend` (the repo IS a React product; testing is reflected in task_type)
- Building a new Webpack plugin (i.e. Webpack repo itself) → `devtools_test`; using Jest to test a backend API (i.e. the repo is a backend) → `web_backend`
- Do NOT output `networking_api`, `infra_as_code`, or `devops_pipeline`; these are legacy labels.
- `docs_knowledge` is allowed as a compatibility label and will be remapped by post-processing.

