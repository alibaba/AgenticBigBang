# Classification Task 4: Task Specification Type

**Available Options:**
- **fuzzy**: Task needs more specifications, vague requirements, unclear goals
- **specific**: Task is detailed, self-contained, with clear requirements

---

# Classification Task 5: Dependency Context

Choose the **single best** option describing what external dependencies the task requires.

- **codebase**: Requires access to existing codebase only (reading/modifying existing code, no special environment needed)
- **env**: Requires specific runtime/development environment only (installed packages, services, databases, but no existing codebase to modify)
- **codebase+env**: Requires BOTH existing codebase AND specific environment (e.g., modifying code that depends on a running database, or fixing tests that need a specific runtime)
- **none**: No external dependencies (standalone code generation from scratch, theoretical discussion, conceptual explanation)

**Guidelines:**
- Choose `codebase+env` when the task clearly requires both reading/modifying existing code AND having specific environment setup
- A task modifying existing code that also needs `pip install` or a running service → `codebase+env`
- A task setting up a new environment from scratch without existing code → `env`
- A task only reading and modifying files in an existing project → `codebase`

