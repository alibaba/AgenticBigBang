llm:
  base_url: "https://api.example.com/v1"
  api_key: "${LLM_API_KEY}"
  model: "your-model-name"
  max_concurrent: 4
  requests_per_minute: 30
  timeout: 300
  max_retries: 3
  ssl_verify: true

input:
  # Require an explicit --input for the full pipeline.
  path: null

labeling:
  l1_mode: "preserve"
  l1_max_tokens: 4096
  l2_max_tokens: 12800

pipeline:
  output_dir: "./output/trajectory_full"
  batch_size: 4
  log_level: "INFO"
